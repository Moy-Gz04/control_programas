# Blueprint de Render — puedes usar "New + > Blueprint" en Render y apuntarlo
# a este repositorio para crear el servicio automáticamente, o crear el
# Web Service manualmente y copiar estos mismos valores.
services:
  - type: web
    name: programas-bienestar-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false   # pega aquí la cadena de conexión de Neon
      - key: JWT_SECRET
        sync: false   # genera un valor aleatorio largo
      - key: CORS_ORIGIN
        sync: false   # ej. https://programas-bienestar.netlify.app
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false   # pega el JSON completo de la cuenta de servicio de Google
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false   # opcional; por defecto usa la carpeta 1YKQSocJcd_05eN87_vqD4yA6k3OzVfyV
      - key: NODE_VERSION
        value: 20