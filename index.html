<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3A0818">
<title>Iniciar Sesión | Sistema de Programas — Bienestar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="banda-top"><span class="g1"></span><span class="g2"></span><span class="g3"></span></div>

<!-- Fondo 3D sutil (nube de puntos dorados/guinda), ver assets/js/login-fx.js.
     Progressive enhancement: si Three.js no carga o el dispositivo no
     aplica, el fondo degradado guinda (CSS) se ve igual de bien. -->
<canvas id="bg3d" class="bg3d" aria-hidden="true"></canvas>

<!-- Lluvia de flores de cempasúchil: capa de fondo decorativa, igual que
     correspondencia (mismas imagen y script). Ver assets/js/lluvia.js. -->
<div class="lluvia-flores" id="lluvia-flores"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-head">
      <img class="brand-logo" src="assets/img/logo.png" alt="Logo" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex';">
      <div id="logoFallback" class="brand-logo-fallback" style="display:none;">B</div>
      <h1>Sistema de Programas</h1>
      <p>Secretaría de Bienestar e Inclusión Social</p>
    </div>
    <div class="login-body">
      <div class="login-error" id="loginError"></div>
      <form id="loginForm">
        <div class="field" style="margin-bottom:16px;">
          <label>Correo institucional</label>
          <input type="email" id="email" placeholder="usuario@bienestar.gob.mx" autocomplete="username" required>
        </div>
        <div class="field" style="margin-bottom:22px;">
          <label>Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Iniciar Sesión</button>
      </form>
      <div class="login-footer-note">Acceso exclusivo para personal autorizado.<br>Si olvidaste tu contraseña, contacta al administrador del sistema.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Overlay "despertando servidor": visible mientras el backend en Render
     (plan gratuito) sale de reposo. Lo controla assets/js/auth.js. -->
<div class="wake-overlay" id="wakeOverlay" aria-hidden="true">
  <div class="wake-card">
    <div class="wake-spinner"></div>
    <h2>Despertando servidor…</h2>
    <p>El sistema estaba inactivo. Esto suele tardar unos <strong>40 segundos</strong>, por favor espera.</p>
    <div class="wake-bar-track"><div class="wake-bar-fill" id="wakeBarFill"></div></div>
    <div class="wake-countdown" id="wakeCountdown">40 s</div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/lluvia.js"></script>

<!-- GSAP (entrada animada) y Three.js (fondo 3D) — carga diferida al final,
     no bloquean el render ni el envío del formulario de login. Si alguno
     falla, assets/js/login-fx.js lo detecta y no hace nada (ver ahí). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="assets/js/login-fx.js" defer></script>
</body>
</html>
