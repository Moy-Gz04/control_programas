[build]
  publish = "."

# Reenvía /api/* al backend de Render para que el frontend llame rutas
# relativas (mismo origen) y evitar problemas de CORS.
# IMPORTANTE: reemplaza la URL por la de tu servicio real en Render
# una vez que lo despliegues (Render te la asigna, ej. https://programas-bienestar-api.onrender.com).
[[redirects]]
  from = "/api/*"
  to = "https://control-programas.onrender.com/api/:splat"
  status = 200
  force = true

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
